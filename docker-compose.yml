services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Provider choice + gateway key come from .env via compose interpolation;
      # only these are passed in, so the rest of .env (e.g. API_KEYS) doesn't leak in.
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OPENAI_COMPAT_BASE_URL=http://host.docker.internal:20128/v1
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_MODEL_PREFIX=${OPENAI_COMPAT_MODEL_PREFIX:-ollama/}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_TOOL_MODEL=${OLLAMA_TOOL_MODEL:-llama3.1:8b}
      - QDRANT_URL=http://qdrant:6333
      - SEARXNG_URL=http://searxng:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
      # Lets the sandbox/MCP subprocess calls launch sibling containers on
      # the host's Docker engine (Docker-outside-of-Docker) -- see the note
      # in Dockerfile.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - qdrant
      - searxng
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  telegram-bot:
    build: .
    command: ["python", "-m", "backend.app.telegram.bot"]
    environment:
      - PLATFORM_URL=http://backend:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
    depends_on:
      backend:
        condition: service_healthy
    # Exits 0 when no token is configured, so it isn't restarted in a loop.
    restart: on-failure
    healthcheck:
      # The image's HEALTHCHECK probes the API server, which this container doesn't run.
      disable: true

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

volumes:
  qdrant_data:
  app_data:
